<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ML</title>

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://unpkg.com/swiper@9/swiper-bundle.min.css" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>ML</h1>
    <nav id="effectMenu">
      <select id="effectSelect" aria-label="Chọn hiệu ứng">
        <option value="fade">Fade</option>
        <option value="slide">Slide</option>
        <option value="kenburns">Ken Burns</option>
        <option value="parallax">Parallax</option>
        <option value="cube">Cube / 3D</option>
        <option value="glitch">Glitch</option>
        <option value="mosaic">Mosaic</option>
        <option value="particles">Particles (WebGL)</option>
        <option value="shader">Shader (WebGL)</option>
        <option value="auto">Auto-mix</option>
      </select>
    </nav>
  </header>

  <main>
    <!-- Container for slides -->
    <div id="slideshowRoot">
      <!-- Swiper structure (used for many effects) -->
      <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="slidesWrapper">
          <!-- Slides injected by JS -->
        </div>
        <!-- navigation -->
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
      </div>

      <!-- Canvas for WebGL effects -->
      <canvas id="glCanvas" style="display:none;"></canvas>
    </div>
  </main>

  <footer>
    <small>Created with Swiper, GSAP, Three.js</small>
  </footer>

  <!-- Libraries -->
  <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
  <script src="https://unpkg.com/swiper@9/swiper-bundle.min.js"></script>
  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/three@0.154.0/build/three.min.js"></script>

  <!-- Main JS -->
  <script src="assets/js/main.js"></script>
</body>
</html>
